name: Secure pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

# The token of every job can only read the repository
permissions:
  contents: read

# With an explicit shell a step also fails when a command in the middle of a pipe fails
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (syntax, expressions, shellcheck of every run step)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: zizmor (injection, excessive permissions, unpinned actions, credential leaks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 .github/workflows

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the latest
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the full history
        run: ./gitleaks git . --redact --verbose --report-format json --report-path gitleaks-report.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  sast:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cppcheck

      - name: Analyse the server code
        run: |
          cppcheck --version
          cppcheck -j "$(nproc)" --quiet --language=c++ --std=c++20 --enable=warning --error-exitcode=1 \
            --suppress=missingInclude --suppress=unmatchedSuppression --suppressions-list=.cppcheck-suppressions --inline-suppr \
            -I Common/include -I Common/include/Utils -I Common -I AuthServer/include -I MainServer/include -I CastServer/include \
            --xml --output-file=cppcheck.xml AuthServer Common MainServer CastServer

      - name: Summarise the findings
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections
          import xml.etree.ElementTree as ET
          errors = ET.parse('cppcheck.xml').getroot().find('errors')
          counts = collections.Counter(e.get('severity') for e in errors)
          print('### cppcheck')
          print('| severity | findings |')
          print('|---|---|')
          for severity, count in counts.most_common():
              print(f'| {severity} | {count} |')
          PY

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cppcheck-report
          path: cppcheck.xml

  fuzz:
    name: Fuzz the parsers (libFuzzer, 60 s each)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang-18 libclang-rt-18-dev libcrypto++-dev

      - name: Build the fuzz targets
        run: |
          FLAGS=(-std=c++2b -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined -IExternalLibraries -ICommon -ICommon/include -ICommon/include/Utils)
          clang++-18 "${FLAGS[@]}" Tools/fuzz/packet_fuzz.cpp Common/src/Protocol/TcpHeader.cpp -o packet_fuzz
          clang++-18 "${FLAGS[@]}" Tools/fuzz/text_fuzz.cpp -lcryptopp -o text_fuzz

      - name: Fuzz the packet parser
        run: mkdir -p corpus/packet && ./packet_fuzz -max_total_time=60 -print_final_stats=1 -artifact_prefix=crash-packet- corpus/packet 2>&1 | tail -25 | tee packet-fuzz.txt

      - name: Fuzz the log text handling
        run: mkdir -p corpus/text && ./text_fuzz -max_total_time=60 -print_final_stats=1 -artifact_prefix=crash-text- corpus/text 2>&1 | tail -25 | tee text-fuzz.txt

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-results
          path: |
            packet-fuzz.txt
            text-fuzz.txt
            crash-*
          if-no-files-found: ignore

  build-test:
    name: Build, unit tests and SBOM (Linux, gcc-14)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-bin
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BASELINE: 4e08971f3ddc13018ca858a692efe92d3b6b9fce
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-14 g++-14 cmake ninja-build git curl zip unzip tar pkg-config python3 \
            autoconf automake autoconf-archive libtool bison flex ca-certificates binutils

      - name: Restore the compiled dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-bin
          key: vcpkg-${{ runner.os }}-gcc14-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-${{ runner.os }}-gcc14-

      - name: Get vcpkg at the pinned baseline
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone -q https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout -q "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build -- -k 0

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Manifest signing tests
        run: |
          python3 -m pip install --quiet --break-system-packages cryptography
          python3 Tools/tests/test_signing.py

      - name: Check the hardening in the binaries
        run: |
          {
            for f in AuthServer.elf MainServer.elf CastServer.elf; do
              [ -f "$f" ] || f="Output/$f"
              echo "== $f"
              readelf -h "$f" | grep 'Type:'
              readelf -lW "$f" | grep -E 'GNU_RELRO|GNU_STACK'
              readelf -d "$f" | grep -E 'BIND_NOW|FLAGS'
              echo "stack protector: $(nm -D "$f" | grep -c __stack_chk_fail)"
              echo "fortify calls:   $(nm -D "$f" | grep -c '_chk@\|_chk$')"
            done
          } | tee hardening.txt

      - name: Generate the SBOM from vcpkg
        run: python3 Tools/sbom/merge_vcpkg_spdx.py --installed build/vcpkg_installed --triplet x64-linux --manifest vcpkg.json --out sbom.spdx.json | tee sbom-completeness.txt

      - name: Keep the SBOM and the hardening report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-and-hardening
          path: |
            sbom.spdx.json
            sbom-completeness.txt
            hardening.txt

  sbom-scan:
    name: Vulnerability scan of the SBOM (Syft, Grype)
    runs-on: ubuntu-24.04
    needs: build-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-and-hardening

      - name: SBOM of the repository as CycloneDX (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan the vcpkg SBOM (Grype)
        id: scan-vcpkg
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json

      - name: Scan the repository SBOM (Grype)
        id: scan-repo
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json

      - name: Summarise the findings
        if: always()
        env:
          VCPKG_REPORT: ${{ steps.scan-vcpkg.outputs.json }}
          REPO_REPORT: ${{ steps.scan-repo.outputs.json }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" | tee scan-summary.txt
          import collections, json, os
          for title, variable in (('vcpkg SBOM', 'VCPKG_REPORT'), ('repository SBOM', 'REPO_REPORT')):
              if not os.environ.get(variable):
                  print(f'### {title}: no report')
                  continue
              data = json.load(open(os.environ[variable]))
              matches = data.get('matches', [])
              counts = collections.Counter(m['vulnerability']['severity'] for m in matches)
              print(f'### {title}: {len(matches)} matches')
              for severity, count in counts.most_common():
                  print(f'- {severity}: {count}')
              for m in sorted(matches, key=lambda x: x['vulnerability']['id'])[:40]:
                  print(f"  {m['vulnerability']['id']} {m['vulnerability']['severity']} {m['artifact']['name']} {m['artifact']['version']}")
          PY
          [ -z "$VCPKG_REPORT" ] || cp "$VCPKG_REPORT" grype-vcpkg.json
          [ -z "$REPO_REPORT" ] || cp "$REPO_REPORT" grype-repo.json

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-scan
          path: |
            sbom.cdx.json
            grype-vcpkg.json
            grype-repo.json
            scan-summary.txt

  license-check:
    name: License gate on the SBOM
    runs-on: ubuntu-24.04
    needs: build-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-and-hardening

      - name: Checker tests
        run: python3 Tools/tests/test_license_check.py

      - name: Check every package against the allow list
        run: |
          status=0
          python3 Tools/sbom/check_licenses.py --sbom sbom.spdx.json --allow Tools/sbom/allowed-licenses.txt             --overrides Tools/sbom/license-overrides.json --report license-check.json --table license-check.md || status=$?
          cat license-check.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-check
          path: |
            license-check.json
            license-check.md
          if-no-files-found: ignore

  host-scripts:
    name: Host scripts (shellcheck, dry run on Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax and shellcheck
        run: |
          shellcheck --version | head -2
          for f in deploy/host/*.sh deploy/db-backup/*.sh deploy/scripts/*.sh deploy/db-init/*.sh deploy/docker-entrypoint.sh deploy/healthcheck.sh; do
            bash -n "$f"
            shellcheck --severity=warning "$f"
          done

      - name: Bootstrap script, dry run (changes nothing)
        run: |
          deploy/host/bootstrap-host.sh --lock-ssh-to-access | tee bootstrap-dry-run.txt
          # --apply must refuse without a key, and nothing may have changed
          if deploy/host/bootstrap-host.sh --apply 2>&1 | tee -a bootstrap-dry-run.txt; then echo "apply without root/key should fail"; exit 1; fi || true
          test ! -e /etc/sudoers.d/90-tmadmin
          if id tmadmin 2>/dev/null; then echo "user was created by a dry run"; exit 1; fi

      - name: The deploy key can run nothing but the deploy command
        run: |
          for c in "" "bash" "deploy latest" "deploy sha-123; id" "deploy sha-0123456789abcdef0123456789abcdef01234567 extra"; do
            out=$(SSH_ORIGINAL_COMMAND="$c" deploy/host/tm-deploy.sh < /dev/null 2>&1) && { echo "accepted: '$c'"; exit 1; } || echo "refused '$c': $out"
          done

      - name: Compose file renders (placeholders only)
        run: |
          TM_DOMAIN=example.invalid docker compose -f deploy/docker-compose.yml config --quiet
          ! TM_DOMAIN='' docker compose -f deploy/docker-compose.yml config --quiet 2>/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: host-scripts
          path: bootstrap-dry-run.txt
          if-no-files-found: ignore

  image:
    name: Container image (build and smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      IMAGE_LOCAL: tm_emulator:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same cache the build-test job fills. It only seeds the build (read only); packages that are missing are compiled.
      - name: Restore the compiled dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-bin
          key: vcpkg-${{ runner.os }}-gcc14-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-${{ runner.os }}-gcc14-

      - name: Make sure the seed folder exists
        run: mkdir -p .cache/vcpkg-bin

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds only. Nothing is pushed here: pushing is the job publish-image, on main, after everything else passed.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          build-contexts: |
            vcpkg-seed=.cache/vcpkg-bin
          load: true
          push: false
          tags: ${{ env.IMAGE_LOCAL }}
          cache-from: type=gha,scope=tm-image
          cache-to: type=gha,scope=tm-image,mode=max

      - name: What is in the image
        run: |
          {
            docker image inspect "$IMAGE_LOCAL" --format 'size {{.Size}} bytes, user "{{.Config.User}}", entrypoint {{.Config.Entrypoint}}'
            docker run --rm --entrypoint /bin/bash "$IMAGE_LOCAL" -c '
              id; echo "-- tools that must not be there:"; for t in gcc g++ cc make cmake gdb strace tcpdump mysql mariadb mysqld supervisord python3 perl curl wget; do command -v $t || true; done; echo "(end of list)"
              ls -l /app/emu/Output'
          } | tee image-contents.txt

      - name: Smoke test with the compose file (database, netns and the three servers)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tm"
          mkdir -p "$work/logs"
          sudo chown 10001:10001 "$work/logs"
          export TM_DOMAIN=example.invalid TM_IMAGE="$IMAGE_LOCAL" TM_SECRETS_DIR="$work/secrets" TM_LOG_HOST_DIR="$work/logs" TM_SCHEMA_SQL="$PWD/microvolts-db.sql"
          # Cloudflare's test secret key passes every token, so registration goes through the real siteverify call over TLS
          printf '1x0000000000000000000000000000000AA' > "$RUNNER_TEMP/turnstile-test-secret"
          deploy/scripts/make-secrets.sh --dir "$TM_SECRETS_DIR" --turnstile-secret-file "$RUNNER_TEMP/turnstile-test-secret" > /dev/null
          export TM_REGISTER_LIMIT_PER_HOUR=3
          # the next steps (API scan, tear down) run docker compose against the same stack
          printf '%s\n' "TM_DOMAIN=$TM_DOMAIN" "TM_IMAGE=$TM_IMAGE" "TM_SECRETS_DIR=$TM_SECRETS_DIR" "TM_LOG_HOST_DIR=$TM_LOG_HOST_DIR" "TM_SCHEMA_SQL=$TM_SCHEMA_SQL" "TM_WORK=$work" >> "$GITHUB_ENV"
          cd deploy
          docker compose config --quiet
          if ! docker compose up --detach --wait --wait-timeout 420 db netns auth main cast; then
            docker compose ps -a
            docker compose logs --no-color
            exit 1
          fi
          {
            echo "== services"; docker compose ps
            echo "== settings of every container"
            for c in $(docker compose ps -q); do
              docker inspect "$c" --format '{{.Name}} user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} secopt={{.HostConfig.SecurityOpt}} mem={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} privileged={{.HostConfig.Privileged}} ports={{json .NetworkSettings.Ports}}'
            done
            echo "== published ports on the host (must be 13000, 13005, 13006 only)"
            docker compose ps --format '{{.Service}} {{.Ports}}'
            echo "== game ports from the host"
            for p in 13000 13005 13006; do (exec 3<>/dev/tcp/127.0.0.1/$p) && echo "port $p open"; done
            echo "== staff login 13001 is not published: 127.0.0.1 must refuse"
            if (exec 3<>/dev/tcp/127.0.0.1/13001) 2>/dev/null; then echo "FAIL 13001 reachable"; exit 1; else echo "13001 refused on 127.0.0.1 (good)"; fi
            echo "== staff login 13001 from the host through the container address (the SSH tunnel path)"
            (exec 3<>/dev/tcp/172.28.0.10/13001) && echo "13001 reachable on 172.28.0.10 from the host"
            echo "== account API: a peer that is not the tunnel (the host, 172.28.0.1) is dropped"
            if curl -sS -m 10 http://172.28.0.10:8080/account/status; then echo "FAIL the host reached the API"; exit 1; else echo "dropped (good)"; fi
            # cloudflared shares the namespace of netns, so a curl container in that namespace connects the way the tunnel does
            api() { docker run --rm --network "container:$(docker compose ps -q netns)" curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69 -sS -m 20 "$@"; }
            base=http://172.28.0.10:8080/account
            body() { printf '{"username":"%s","nickname":"%s","password":"%s","email":"%s@example.invalid","turnstile":"XXXX.DUMMY.TOKEN.XXXX"}' "$1" "$1" "$2" "$1"; }
            reg() { api -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H "CF-Connecting-IP: $1" -d "$(body "$2" "$3")" "$base/register"; }
            check() { echo "$1: got $2, want $3"; [ "$2" = "$3" ] || { echo "FAIL $1"; exit 1; }; }
            echo "== account API through the tunnel path"
            echo "status: $(api "$base/status")"
            # throwaway passwords made for this run only, so none is written in the repository
            first=$(openssl rand -hex 12); second=$(openssl rand -hex 12); wrong=$(openssl rand -hex 12)
            check "register 1 from 198.51.100.7 (Turnstile siteverify over TLS)" "$(reg 198.51.100.7 ciplayer1 "$first")" 201
            check "register 2 from 198.51.100.7" "$(reg 198.51.100.7 ciplayer2 "$first")" 201
            check "register the same username again" "$(reg 198.51.100.7 ciplayer1 "$first")" 409
            check "register 4 from 198.51.100.7 (limit 3 per hour)" "$(reg 198.51.100.7 ciplayer3 "$first")" 429
            check "register from another player address, 198.51.100.8" "$(reg 198.51.100.8 ciplayer3 "$first")" 201
            check "register with a weak password" "$(reg 198.51.100.9 ciplayer4 'short')" 400
            # a password from every breach list: refused by the server's own range check (Pwned Passwords over TLS)
            check "register with a breached password" "$(reg 198.51.100.10 ciplayer5 'qwertyuiop')" 400
            login() { api -H 'Content-Type: application/json' -H "CF-Connecting-IP: 198.51.100.20" -d "{\"username\":\"$1\",\"password\":\"$2\"}" -w '\n%{http_code}' "$base/login"; }
            out=$(login ciplayer1 "$wrong"); check "login with a wrong password" "${out##*$'\n'}" 401
            out=$(login nosuchplayer "$wrong"); check "login with an unknown username (same answer)" "${out##*$'\n'}" 401
            out=$(login ciplayer1 "$first"); check "login" "${out##*$'\n'}" 200
            token=$(printf '%s' "${out%$'\n'*}" | jq -r .token)
            echo "me: $(api -H "Authorization: Bearer $token" "$base/me")"
            check "me without a token" "$(api -o /dev/null -w '%{http_code}' "$base/me")" 401
            me() { api -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" "$base/me"; }
            out=$(login ciplayer1 "$first"); check "a second login of the same account" "${out##*$'\n'}" 200
            other=$(printf '%s' "${out%$'\n'*}" | jq -r .token)
            out=$(api -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d "$(printf '{"current_password":"%s","new_password":"%s"}' "$first" "$second")" -w '\n%{http_code}' "$base/password")
            check "password change" "${out##*$'\n'}" 200
            renewed=$(printf '%s' "${out%$'\n'*}" | jq -r .token)
            check "the token that changed the password, after the change" "$(me "$token")" 401
            check "the other session, after the change" "$(me "$other")" 401
            check "the token the change answered with" "$(me "$renewed")" 200
            out=$(login ciplayer1 "$first"); check "login with the old password" "${out##*$'\n'}" 401
            out=$(login ciplayer1 "$second"); check "login with the new password" "${out##*$'\n'}" 200
            check "logout" "$(api -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $renewed" "$base/logout")" 204
            check "the token after the logout" "$(me "$renewed")" 401
            check "logout again with the same token" "$(api -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $renewed" "$base/logout")" 401
            check "website token on a staff command (/announce)" "$(api -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d '{"message":"ci"}' http://172.28.0.10:8080/announce)" 401
            echo "CORS for the website origin:"; api -s -o /dev/null -D - -X OPTIONS -H 'Origin: https://www.example.invalid' -H 'Access-Control-Request-Method: POST' "$base/login" | grep -i '^access-control-allow-origin' || { echo "FAIL no CORS header for the website"; exit 1; }
            echo "CORS for another origin (no header expected):"
            if api -s -o /dev/null -D - -X OPTIONS -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST' "$base/login" | grep -i '^access-control-allow-origin'; then echo "FAIL another origin got a CORS header"; exit 1; else echo "none (good)"; fi
            echo "== security events of the account API (JSON lines for the Blue team)"
            sudo sh -c "cat '$work'/logs/security/*.log" | grep -E 'account_|authn_|authz_|password' | tail -20 || sudo find "$work/logs" -type f
            echo "== database: no published port, limited account"
            docker compose port db 3306 || echo "db has no published port (good)"
            docker compose exec -T db sh -c 'export MYSQL_PWD=$(cat /run/secrets/db_app_password); mariadb -umvapp -e "SHOW GRANTS; SELECT COUNT(*) AS tables_in_schema FROM information_schema.tables WHERE table_schema=\"microvolts-db\"; CREATE DATABASE should_fail" 2>&1 || true'
            echo "== log files written by the servers (TB_LOG_DIR)"
            sudo find "$work/logs" -maxdepth 2 -type f | sort
            echo "== config.ini as generated for MainServer (no secret values in it)"
            docker compose exec -T main sh -c 'cat /app/emu/Setup/config.ini' 2>/dev/null || docker compose exec -T main bash -c 'cat /app/emu/Setup/config.ini'
          } 2>&1 | tee ../smoke-test.txt
          echo "== backup and restore round trip with a throwaway key" | tee -a ../smoke-test.txt
          {
            export GNUPGHOME="$work/gpg-priv"; mkdir -m 700 "$GNUPGHOME"
            gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'tm ci backup <ci@example.invalid>' rsa3072 encrypt 1d 2>&1
            fpr=$(gpg --list-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')
            gpg --export --armor "$fpr" > "$work/backup-public.asc"
            unset GNUPGHOME
            sql() { docker compose exec -T db sh -c "MYSQL_PWD=\$(cat /run/secrets/db_app_password) mariadb -umvapp --batch --skip-column-names microvolts-db -e \"$1\""; }
            sql 'CREATE TABLE tm_marker (x INT); INSERT INTO tm_marker VALUES (42)'
            GPG_RECIPIENT="$fpr" TM_BACKUP_ENV=/dev/null TM_BACKUP_PUBKEY="$work/backup-public.asc" TM_BACKUP_GNUPGHOME="$work/gpg-pub"                 db-backup/tm-backup.sh --local-only "$work/backups"
            ls -l "$work/backups"
            echo "plain text visible in the encrypted file: $(grep -c tm_marker "$work"/backups/*.gpg || true) (must be 0)"
            sql 'DROP TABLE tm_marker'
            GNUPGHOME="$work/gpg-priv" db-backup/tm-restore.sh --decrypt "$work"/backups/toymayhem-*.sql.gz.gpg | TM_COMPOSE_PROJECT=toymayhem db-backup/tm-restore.sh --load --yes
            echo "after restore, tm_marker holds: $(sql 'SELECT x FROM tm_marker')"
            test "$(sql 'SELECT x FROM tm_marker')" = 42
            sql 'DROP TABLE tm_marker'
          } 2>&1 | tee -a ../smoke-test.txt
          # the single quotes are meant: the loop and the substitutions run in the inner bash, which timeout starts
          # shellcheck disable=SC2016
          timeout 180 bash -c 'for s in auth main cast; do until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q $s)")" = healthy ]; do sleep 3; done; done'
          echo "== restart one server, it must come back healthy"
          docker compose restart main
          # shellcheck disable=SC2016
          timeout 120 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q main)")" = healthy ]; do sleep 3; done'
          docker compose ps | tee -a ../smoke-test.txt
          docker compose logs --no-color --tail 40 | tee ../smoke-logs.txt > /dev/null

      # The stack of the smoke test is still running. The scan reaches the API the way the tunnel does: from inside the
      # network namespace of the netns container. The rate limits were tested above, so main is restarted with higher ones,
      # otherwise the scan would only ever see the 429 answer.
      - name: Account API scan (OWASP ZAP, OpenAPI description in .zap/account-api.yaml)
        working-directory: deploy
        timeout-minutes: 40
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
        run: |
          set -euo pipefail
          TM_REGISTER_LIMIT_PER_HOUR=9999 TM_LOGIN_LIMIT_PER_15MIN=9999 TM_PASSWORD_LIMIT_PER_15MIN=9999 \
            docker compose up --detach --wait --wait-timeout 180 --force-recreate --no-deps main
          netns=$(docker compose ps -q netns)
          api() { docker run --rm --network "container:$netns" curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69 -sS -m 30 "$@"; }
          base=http://172.28.0.10:8080/account
          # Two throwaway accounts. /account/logout ends the session of the account, so it is scanned on its own with the
          # second one; the first keeps its token for every other endpoint.
          token_for() {
            local user=$1 pass
            pass=$(openssl rand -hex 12)
            api -o /dev/null -f -H 'Content-Type: application/json' -H 'CF-Connecting-IP: 198.51.100.50' \
              -d "$(printf '{"username":"%s","nickname":"%s","password":"%s","email":"%s@example.invalid","turnstile":"XXXX.DUMMY.TOKEN.XXXX"}' "$user" "$user" "$pass" "$user")" "$base/register"
            api -f -H 'Content-Type: application/json' -H 'CF-Connecting-IP: 198.51.100.50' \
              -d "$(printf '{"username":"%s","password":"%s"}' "$user" "$pass")" "$base/login" | jq -r .token
          }
          token_main=$(token_for zapscan1)
          token_logout=$(token_for zapscan2)
          mkdir -p zap/api zap/logout
          chmod 777 zap/api zap/logout
          cp ../.zap/rules.tsv ../.zap/hooks.py zap/api/
          cp ../.zap/rules.tsv ../.zap/hooks.py zap/logout/
          yq 'del(.paths["/account/logout"])' ../.zap/account-api.yaml > zap/api/openapi.yaml
          yq '.paths |= with_entries(select(.key == "/account/logout"))' ../.zap/account-api.yaml > zap/logout/openapi.yaml
          status=0
          for scan in api logout; do
            if [ "$scan" = api ]; then ZAP_ACCOUNT_TOKEN=$token_main; else ZAP_ACCOUNT_TOKEN=$token_logout; fi
            export ZAP_ACCOUNT_TOKEN
            rc=0
            docker run --rm --network "container:$netns" -e ZAP_ACCOUNT_TOKEN -v "$PWD/zap/$scan:/zap/wrk" "$ZAP_IMAGE" \
              zap-api-scan.py -t openapi.yaml -f openapi -c rules.tsv -P 8090 --hook=/zap/wrk/hooks.py -r report.html -J report.json 2>&1 | tee "zap/$scan/zap-output.txt" || rc=$?
            echo "zap-api-scan $scan exit code $rc" | tee -a "zap/$scan/zap-output.txt"
            [ "$rc" -le "$status" ] || status=$rc
          done
          exit "$status"

      - name: Summarise the API scan
        if: always()
        working-directory: deploy
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, re
          print('### OWASP ZAP API scan')
          for scan in ('api', 'logout'):
              folder = f'zap/{scan}'
              if not os.path.exists(f'{folder}/zap-output.txt'):
                  continue
              text = open(f'{folder}/zap-output.txt', encoding='utf-8', errors='replace').read()
              totals = re.findall(r'FAIL-NEW: \d+.*PASS: \d+', text)
              print(f'**scan "{scan}"**: ' + (totals[-1] if totals else 'no result line'))
              if os.path.exists(f'{folder}/report.json'):
                  alerts = [a for site in json.load(open(f'{folder}/report.json')).get('site', []) for a in site.get('alerts', [])]
                  if alerts:
                      print('')
                      print('| rule | alert | risk | instances |')
                      print('|---|---|---|---|')
                      for a in sorted(alerts, key=lambda x: x['pluginid']):
                          print(f"| {a['pluginid']} | {a['name']} | {a['riskdesc']} | {a['count']} |")
                  else:
                      print('no alerts')
              print('')
          PY

      - name: Keep the API scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-api-report
          path: |
            deploy/zap/api/report.html
            deploy/zap/api/report.json
            deploy/zap/api/zap-output.txt
            deploy/zap/logout/report.html
            deploy/zap/logout/report.json
            deploy/zap/logout/zap-output.txt
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        working-directory: deploy
        run: docker compose down --volumes

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-results
          path: |
            image-contents.txt
            smoke-test.txt
            smoke-logs.txt
          if-no-files-found: ignore

      - name: Save the tested image
        run: docker save "$IMAGE_LOCAL" | gzip -1 > tm_emulator-image.tar.gz

      - name: Hand the tested image to the scan and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: tm_emulator-image.tar.gz
          retention-days: 1

  image-scan:
    name: CVE scan of the built image (Grype)
    runs-on: ubuntu-24.04
    needs: image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      # The exact image the smoke test ran and the publish job pushes. .grype.yaml (reviewed ignores, one reason each) is read from the workspace.
      - name: Load the image
        run: docker load --input tm_emulator-image.tar.gz

      - name: Scan the image (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tm_emulator:ci
          fail-build: false   # the next step decides, so the report and the summary are written first
          output-format: json

      - name: Table, summary and verdict (fails on high and critical)
        env:
          REPORT: ${{ steps.scan.outputs.json }}
        run: |
          cp "$REPORT" grype-image.json
          python3 - <<'PY' | tee image-scan.txt >> "$GITHUB_STEP_SUMMARY"
          import collections, json, sys
          data = json.load(open('grype-image.json'))
          rank = {'Critical': 0, 'High': 1, 'Medium': 2, 'Low': 3, 'Negligible': 4, 'Unknown': 5}
          matches = sorted(data.get('matches', []), key=lambda m: (rank.get(m['vulnerability']['severity'], 9), m['vulnerability']['id']))
          ignored = data.get('ignoredMatches', [])
          counts = collections.Counter(m['vulnerability']['severity'] for m in matches)
          print('### Image scan (Grype)')
          print(f"{len(matches)} findings, {len(ignored)} suppressed by the reviewed ignore list (.grype.yaml)")
          print('')
          print('| severity | findings |')
          print('|---|---|')
          for severity in sorted(counts, key=lambda k: rank.get(k, 9)):
              print(f'| {severity} | {counts[severity]} |')
          print('')
          print('| severity | vulnerability | package | installed | fixed in |')
          print('|---|---|---|---|---|')
          for m in matches:
              if rank.get(m['vulnerability']['severity'], 9) <= 2:
                  fixed = ', '.join(m['vulnerability'].get('fix', {}).get('versions', [])) or '-'
                  print(f"| {m['vulnerability']['severity']} | {m['vulnerability']['id']} | {m['artifact']['name']} | {m['artifact']['version']} | {fixed} |")
          if ignored:
              print('')
              print('Suppressed: ' + ', '.join(sorted({f"{m['vulnerability']['id']} ({m['artifact']['name']})" for m in ignored})))
          failing = [m for m in matches if m['vulnerability']['severity'] in ('Critical', 'High')]
          sys.stderr.write(f'{len(failing)} high or critical findings\n')
          open('verdict.txt', 'w').write(str(len(failing)))
          PY
          test "$(cat verdict.txt)" = 0

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: |
            grype-image.json
            image-scan.txt
          if-no-files-found: ignore

  publish-image:
    name: Publish the image (ghcr.io, main only)
    # Only pushes to main, and only when every other job of this run passed. Pull requests and branches never get here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image, image-scan, build-test, sbom-scan, license-check, host-scripts, workflows, sast, fuzz, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that can write to the registry
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The exact image that passed the smoke test is the one that gets pushed. One tag per commit, plus "main" for the newest.
      - name: Push
        run: |
          # the registry path follows the repository (owner/name), lowercased as ghcr.io requires
          REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input tm_emulator-image.tar.gz
          docker tag tm_emulator:ci "$REGISTRY_IMAGE:sha-${GITHUB_SHA}"
          docker tag tm_emulator:ci "$REGISTRY_IMAGE:main"
          docker push "$REGISTRY_IMAGE:sha-${GITHUB_SHA}" | tee push.txt
          docker push "$REGISTRY_IMAGE:main"
          { echo "### Image"; echo "\`$REGISTRY_IMAGE:sha-${GITHUB_SHA}\`"; grep -o 'digest: sha256:[0-9a-f]*' push.txt | head -1; } >> "$GITHUB_STEP_SUMMARY"
