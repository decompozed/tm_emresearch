# ToyMayhem on the VPS. Run with the settings file next to it:
#   docker compose --env-file tm.env up -d
# Shape:
#   netns       owns the network namespace and the three published game ports. It only sleeps.
#   auth, main, cast, cloudflared   share that namespace (network_mode: service:netns)
#   db          MariaDB, on the internal network only, no ports
# Why one namespace: the three servers look each other up by one local IP (SetupParser: the MainServer entry whose
# LocalIp equals the IP of the process). Giving them one IP is the way that works with one container per server.
# A separate "netns" container keeps the namespace alive when a server crashes and restarts.
#
# Published ports are the only inbound game access: 13000 Auth, 13005 Main, 13006 Cast (all TCP, the servers open no UDP
# listener). 13001 (staff login, bound to TM_APP_IP only), the IPC ports 14005 and 14006 and the account API on 8080
# are NOT published. 8080 leaves through the Cloudflare tunnel, 13001 is reached over SSH, see README.md.

name: toymayhem

x-game: &game
  image: ${TM_IMAGE:-ghcr.io/decompozed/tm_emulator:main}
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  network_mode: "service:netns"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  ulimits:
    core: 0
    nofile: 16384
  tmpfs:
    - /tmp:mode=1777,size=64m
    - /app/emu/Setup:uid=10001,gid=10001,mode=0700,size=1m   # config.ini is generated here at start
  volumes:
    - ${TM_LOG_HOST_DIR:-/srv/toymayhem/logs}:/var/log/toymayhem
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
  depends_on:
    netns: { condition: service_started }
    db: { condition: service_healthy }
  environment:
    TM_APP_IP: ${TM_APP_IP:-172.28.0.10}
    TM_DB_HOST: db
    TM_ALLOWED_ORIGINS: ${TM_ALLOWED_ORIGINS:-https://www.${TM_DOMAIN:?set TM_DOMAIN in tm.env},https://${TM_DOMAIN}}
    TM_ENHANCED_SECURITY: ${TM_ENHANCED_SECURITY:-true}
    TM_CLIENT_VERSION: ${TM_CLIENT_VERSION:-0.0.3}
    TM_TURNSTILE: ${TM_TURNSTILE:-on}
    TM_REGISTER_LIMIT_PER_HOUR: ${TM_REGISTER_LIMIT_PER_HOUR:-5}
    TM_LOGIN_LIMIT_PER_15MIN: ${TM_LOGIN_LIMIT_PER_15MIN:-10}
    TM_PASSWORD_LIMIT_PER_15MIN: ${TM_PASSWORD_LIMIT_PER_15MIN:-5}
    TM_SMTP_SERVER: ${TM_SMTP_SERVER:-smtp://smtp.${TM_DOMAIN}:587}
    TM_EMAIL_SENDER: ${TM_EMAIL_SENDER:-toymayhem@${TM_DOMAIN}}
    TM_EMAIL_USERNAME: ${TM_EMAIL_USERNAME:-toymayhem@${TM_DOMAIN}}
    TM_SECURITY_NOTIFY: ${TM_SECURITY_NOTIFY:-blue@${TM_DOMAIN}}
    TB_LOG_DIR: /var/log/toymayhem
    # every secret as a file: the server reads NAME_FILE (Common/include/Utils/SecretSource.h)
    MV_DB_PW_FILE: /run/secrets/db_app_password
    MV_JWT_FILE: /run/secrets/jwt_secret
    MV_IPC_SECRET_FILE: /run/secrets/ipc_secret
    MV_PW_PEPPER_FILE: /run/secrets/password_pepper
    MVEMAIL_SECRET_FILE: /run/secrets/email_secret
    MV2FA_SECRET_FILE: /run/secrets/twofa_secret
    MV_EMAIL_TOKEN_FILE: /run/secrets/email_token
    MV_TURNSTILE_FILE: /run/secrets/turnstile_secret   # only MainServer reads it
  secrets:
    - db_app_password
    - jwt_secret
    - ipc_secret
    - password_pepper
    - email_secret
    - twofa_secret
    - email_token
    - turnstile_secret

services:
  db:
    image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
    restart: unless-stopped
    user: "999:999"            # mysql from the start, so the image needs no root, setuid or chown
    read_only: true
    tmpfs:
      - /run/mysqld:uid=999,gid=999,mode=0755
      - /tmp:mode=1777,size=64m
    volumes:
      - dbdata:/var/lib/mysql
      - ${TM_SCHEMA_SQL:-./microvolts-db.sql}:/schema/microvolts-db.sql:ro
      - ./db-init/10-schema.sh:/docker-entrypoint-initdb.d/10-schema.sh:ro   # loads the schema on the first start
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: microvolts-db
      MARIADB_USER: mvapp                      # limited account: all rights on microvolts-db only, nothing global
      MARIADB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_root_password, db_app_password]
    # The servers ask for tables like "Users" and "BlockedPlayers", microvolts-db.sql creates "users" and "blockedplayers".
    # That works on Windows; on Linux table names are case sensitive unless the server is started with
    # lower-case-table-names=1 (it must be set when the data folder is created, which is what this does on the first start).
    command: ["--skip-name-resolve", "--lower-case-table-names=1"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    stop_grace_period: 30s
    networks: [backend]                        # internal: no route out, nothing can be published
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  netns:
    image: ${TM_IMAGE:-ghcr.io/decompozed/tm_emulator:main}
    entrypoint: ["/usr/bin/sleep", "infinity"]
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 16m
    cpus: 0.1
    pids_limit: 10
    networks:
      backend: {}                              # reaches db
      app:
        ipv4_address: ${TM_APP_IP:-172.28.0.10}   # has the default route (outbound mail, tunnel); published ports arrive here
    ports:
      - "13000:13000"   # AuthServer
      - "13005:13005"   # MainServer
      - "13006:13006"   # CastServer
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "2" }

  auth:
    <<: *game
    command: ["AuthServer"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh", "13000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  main:
    <<: *game
    command: ["MainServer"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh", "13005"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  cast:
    <<: *game
    command: ["CastServer"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh", "13006"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Carries the account API (MainServer, port 8080) to Cloudflare. Add the public hostname in the settings of the tunnel
  # in the Cloudflare dashboard: api.<TM_DOMAIN>, path ^/account/, -> http://172.28.0.10:8080 (the value of TM_APP_IP).
  # The path matters: the same listener serves the staff commands (/ban, /announce, ...), which must stay off the internet.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    network_mode: "service:netns"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    command: ["--no-autoupdate", "--metrics", "127.0.0.1:20241", "tunnel", "run", "--token-file", "/run/secrets/cf_tunnel_token"]
    secrets: [cf_tunnel_token]
    depends_on:
      main: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  backend:
    internal: true          # database side: no route to the outside
  app:
    ipam:
      config:
        - subnet: ${TM_APP_SUBNET:-172.28.0.0/24}

volumes:
  dbdata: {}

# Files on the host, one per secret. make-secrets.sh creates them (mode 0444 in a root-only directory).
secrets:
  db_root_password:
    file: ${TM_SECRETS_DIR:-./secrets}/db_root_password
  db_app_password:
    file: ${TM_SECRETS_DIR:-./secrets}/db_app_password
  jwt_secret:
    file: ${TM_SECRETS_DIR:-./secrets}/jwt_secret
  ipc_secret:
    file: ${TM_SECRETS_DIR:-./secrets}/ipc_secret
  password_pepper:
    file: ${TM_SECRETS_DIR:-./secrets}/password_pepper
  email_secret:
    file: ${TM_SECRETS_DIR:-./secrets}/email_secret
  twofa_secret:
    file: ${TM_SECRETS_DIR:-./secrets}/twofa_secret
  email_token:
    file: ${TM_SECRETS_DIR:-./secrets}/email_token
  turnstile_secret:
    file: ${TM_SECRETS_DIR:-./secrets}/turnstile_secret
  cf_tunnel_token:
    file: ${TM_SECRETS_DIR:-./secrets}/cf_tunnel_token
