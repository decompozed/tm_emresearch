[AuthServer]
LocalIp =  127.0.0.1
Ip = 127.0.0.1
Port = 13000
GradedPort = 13001
VpnIp = 127.0.0.1  
EnhancedSecurity = false

[MainServer_1]
LocalIp =  127.0.0.1
Ip = 127.0.0.1
Port = 13005
IpcPort = 14005
IsPublic = true

[CastServer_1]
LocalIp =  127.0.0.1
Ip = 127.0.0.1
Port = 13006
IpcPort = 14006
IPC_EnableDeadBroadcast = true

[Database]
LocalIp =  127.0.0.1
Ip = 127.0.0.1
Port = 3305
DatabaseName = microvolts-db
Username = root
PasswordEnvironmentName = MV_DB_PW

[Website]
Ip = 127.0.0.1 # or any website IP you may have
Port = 8080
JwtTokenEnvironmentName = MV_JWT
# JwtTokenPreviousEnvironmentName = MV_JWT_PREVIOUS  # optional, key of the previous rotation: tokens signed with it stay valid until you remove this line
# Every secret variable NAME can instead be given as NAME_FILE=/path/to/file (Docker secrets); setting both is refused
AllowedOrigins = www.allowedOriginTest.com

[Client]
ClientVersion = 0.0.3 # For original MV Surge client use 1.1.1

[General]
EmailSecret = MVEMAIL_SECRET # environment variable containing email encryption key (in hex form without 0x, 32 bytes) 
2faSecret = MV2FA_SECRET     # environment variable containing game 2FA encryption key (in hex form without 0x, 32 bytes)
PasswordPepper = MV_PW_PEPPER  # environment variable containing the password pepper (in hex form without 0x, 32 bytes); without it passwords stay on bcrypt
PasswordPepperVersion = 1      # increase when rotating; put the old pepper's variable name in PasswordPepperPrevious until everybody has logged in
SmtpServer = smtp://smtp.gmail.com:587  # example if you use gmail
EmailSender = sendertest@gmail.com
EmailUsername = emailusername # or use EmailSender depending on the service you're using
EmailToken = MV_EMAIL_TOKEN   # environment variable containing email token to send emails using EmailSender above
SecurityNotificationReceiver = receiver1@gmail.com,  receiver2@gmail.com  # who will receive security notifications


